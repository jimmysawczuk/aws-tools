name: Release new version
on:
  release:
    types: [created]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
        cmd:
          - cloudfront-invalidate
          - ecs-build-appspec
          - ecs-find-template-taskdef
          - ecs-prune-taskdefs
          - retrieve-secret
          - ssm-delete
          - ssm-exec
          - ssm-load
          - ssm-read
    env:
      OUT: ${{ matrix.cmd }}-${{ github.ref_name }}-${{ matrix.platform.goos }}-${{ matrix.platform.goarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Build
        env:
          GOOS: ${{ matrix.platform.goos }}
          GOARCH: ${{ matrix.platform.goarch }}
          CGO_ENABLED: "0"
        run: go build -o "$OUT" -ldflags "-s -w -X main.version=$GITHUB_REF_NAME -X main.revision=$GITHUB_SHA -X main.date=$(date --iso-8601=seconds)" -mod=vendor "./cmd/${{ matrix.cmd }}"
      - name: Upload build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$OUT" --repo "$GITHUB_REPOSITORY"
