name: Release new version
on:
  release:
    types: [created]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    env:
      CMDS: >-
        cloudfront-invalidate
        ecs-build-appspec
        ecs-find-template-taskdef
        ecs-prune-taskdefs
        retrieve-secret
        ssm-delete
        ssm-exec
        ssm-load
        ssm-read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Build
        env:
          GOOS: ${{ matrix.platform.goos }}
          GOARCH: ${{ matrix.platform.goarch }}
          CGO_ENABLED: "0"
        run: |
          ldflags="-s -w -X main.version=$GITHUB_REF_NAME -X main.revision=$GITHUB_SHA -X main.date=$(date --iso-8601=seconds)"
          mkdir -p dist
          for cmd in $CMDS; do
            out="dist/$cmd-$GITHUB_REF_NAME-$GOOS-$GOARCH"
            echo "building $out"
            go build -o "$out" -ldflags "$ldflags" -mod=vendor "./cmd/$cmd"
          done
      - name: Upload builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
