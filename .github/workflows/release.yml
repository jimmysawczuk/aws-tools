name: Release new version
on:
  release:
    types: [created]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.25", "1.26", "1.27"]
    env:
      CMDS: >-
        cloudfront-invalidate
        ecs-build-appspec
        ecs-find-template-taskdef
        ecs-prune-taskdefs
        retrieve-secret
        ssm-delete
        ssm-exec
        ssm-load
        ssm-read
      PLATFORMS: darwin/amd64 linux/amd64 linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
          GO_VERSION: ${{ matrix.go }}
        run: |
          buildtags="-X main.version=$TAG -X main.revision=$GITHUB_SHA -X main.date=$(date --iso-8601=seconds)"
          echo "$buildtags"
          mkdir -p dist
          for platform in $PLATFORMS; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            for cmd in $CMDS; do
              out="dist/$cmd-$TAG-$goos-$goarch-go$GO_VERSION"
              echo "building $out"
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -o "$out" -ldflags "-s -w $buildtags" -mod=vendor "./cmd/$cmd"
            done
          done
      - name: Upload builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}"
